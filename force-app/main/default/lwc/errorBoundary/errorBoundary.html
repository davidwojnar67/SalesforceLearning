<!-- 06_Salesforce/Teorie/12_LWC Lifecycle Hooks a Error Boundary (errorCallback) -->
<template>
    <template lwc:if={hasError}>
        <div class="slds-box slds-theme_error slds-m-around_small" role="alert">
            <h2 class="slds-text-heading_small slds-m-bottom_x-small">
                Komponenta narazila na neočekávanou chybu
            </h2>
            <p class="slds-m-bottom_small">{errorMessage}</p>

            <template lwc:if={errorStack}>
                <pre class="slds-text-body_small slds-m-bottom_small">{errorStack}</pre>
            </template>

            <lightning-button
                label="Zkusit znovu"
                variant="neutral"
                onclick={handleReset}>
            </lightning-button>
        </div>
    </template>

    <template lwc:else>
        <slot></slot>
    </template>
</template>
