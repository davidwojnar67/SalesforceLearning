<template>
    <lightning-card title="Rychlý Servisní Panel" icon-name="custom:custom31">

        <div class="slds-m-around_medium">
            <p>Aktuální kontext (VERZE 3) - ID tohoto Kola je:</p>
            <p><strong>{recordId}</strong></p>
        
            <template lwc:if={bikeName}>
                <div class="slds-box slds-m-top_medium">
                    <p>Název kola: <strong>{bikeName}</strong></p>
                    <p>Aktuální stav: <strong>{bikeServiceStatus}</strong></p>
                    
                    <div class="slds-grid slds-grid_vertical slds-m-top_medium">
                        <div>
                            <lightning-button 
                                label="Rychle označit jako Opraveno" 
                                variant="success" 
                                icon-name="utility:check"
                                onclick={handleServiceStatusChange}>
                            </lightning-button>
                        </div>

                        <div class="slds-m-top_x-small">
                            <lightning-button
                                label="Ověřit v registru API" 
                                variant="brand-outline" 
                                icon-name="utility:connected_apps"
                                disabled={isCheckingRegistry}
                                onclick={handleRegistryCheck}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </template>

            <template lwc:elseif={errorMessage}>
                <p class="slds-text-color_error">{errorMessage}</p>
            </template>

            <div class="slds-m-top_medium">
                <p class="slds-m-bottom_x-small"><strong>Poslední servisní úkony:</strong></p>

                <template for:each={bikePartsList} for:item="part">
                    <c-bike-part-item
                        key={part}
                        part-name={part}
                        onpartselected={handlePartSelected}>
                    </c-bike-part-item>
                </template>

                <lightning-button
                    label="Resetovat kontrolu dílů"
                    variant="base"
                    class="slds-m-top_x-small"
                    onclick={handleResetAllParts}>
                </lightning-button>
            </div>
        </div>

    </lightning-card>
</template>
